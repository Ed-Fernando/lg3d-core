# my.build.properties - Local build overrides for OpenJDK 6 + system Java3D
# This file is loaded before build.properties so its values take precedence.

# Java3D classpath using system-installed Java3D JARs (from libjava3d-java + libvecmath-java)
j3d.classpath=/usr/share/java/j3dcore.jar:/usr/share/java/j3dutils.jar:/usr/share/java/vecmath.jar

# JVM-only / pure Java build settings
nox11=true
nonative=true
